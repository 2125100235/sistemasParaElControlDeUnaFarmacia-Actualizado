<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta - FarmaVive</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div>
            <label for="prod-input">Producto</label>
            <input type="text" id="prod-input">
        </div>
        <div>
            <label for="precio-input">Precio</label>
            <input type="text" id="precio-input">
        </div>
        <div>
            <label for="cant-input">Cantidad</label>
            <input type="number" id="cant-input">
        </div>
        <button type="button">Registrar</button>
    </header>
    <main>
        <aside class="menu">
            <h1>Punto de venta</h1>
            <br>
            <h1>Productos</h1>
            <ul>
                <li><h2>Lista de productos</h2></li>
                <li><h2>Registro de nuevos productos</h2></li>
            </ul>
            <br>
            <h1>Protocolos</h1>
            <ul>
                <li><h2>Guia de antencion al cliente</h2></li>
                <li><h2>Politicas de cobros y garantias</h2></li>
            </ul>
            <br>
            <h1>Contactar a soporte tecnico</h1>
        </aside>
        <section class="contenido">
            <div class="recuadro">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="text"></td>
                            <td><input type="number"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td><input type="text"></td>
                            <td><input type="number"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td><input type="text"></td>
                            <td><input type="number"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td><input type="text"></td>
                            <td><input type="number"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td><input type="text"></td>
                            <td><input type="number"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td><input type="text"></td>
                            <td><input type="number"></td>
                            <td><input type="text"></td>
                        </tr>
                    </tbody>
                </table>

                <div class="totales">
                    <p>Subtotal <span>0.00</span></p>
                    <p>Total c/IVA <span>0.00</span></p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
